<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LingoBounds</title>
    <link rel="stylesheet" href="https://unpkg.com" />
    <style>
        body {
            margin: 0;
            background-color: #121212;
            color: white;
            font-family: system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #nav {
            background-color: #1a1a1a;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            letter-spacing: 2px;
        }
        #map {
            flex: 1;
            width: 100%;
        }
    </style>
</head>
<body>

    <div id="nav">LINGOBOUNDS</div>
    <div id="map"></div>

    <script src="https://unpkg.com"></script>
    <script>
        const map = L.map('map').setView([47.0, 15.0], 4);
        
        L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', {
            attribution: 'OpenStreetMap'
        }).addTo(map);

        map.on('click', function(e) {
            alert("You clicked coordinates: " + e.latlng.lat + ", " + e.latlng.lng);
        });
    </script>

</body>
</html>
