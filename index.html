<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glotle - Language Guessing Game</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div id="flash-overlay"></div>

  <header class="app-header">
    <h1 class="logo">Glotle</h1>
    <div class="header-actions">
      <button id="theme-toggle" class="icon-btn">Dark Mode</button>
      <button id="stats-modal-btn" class="icon-btn">Stats</button>
    </div>
  </header>

  <main class="container">
    <!-- Game View -->
    <section id="game-view" class="view">
      <div class="selector-row">
        <label for="region-select">Region:</label>
        <select id="region-select" class="dropdown">
          <option value="Europe" selected>Europe</option>
          <option value="Africa">Africa</option>
          <option value="Asia">Asia</option>
          <option value="Americas and Pacific">Americas and Pacific</option>
          <option value="World">World</option>
        </select>
      </div>

      <div class="streak-bar">
        <span>Streak: <strong id="streak-count">0</strong></span>
        <span>Best: <strong id="best-streak">0</strong></span>
      </div>

      <div class="card">
        <p id="sentence-prompt" class="sentence">Loading sentence...</p>
      </div>

      <div class="input-container">
        <input type="text" id="language-input" placeholder="Type a language..." autocomplete="off" />
        <ul id="suggestions-list" class="suggestions-box"></ul>
      </div>

      <button id="submit-btn" class="primary-btn">Submit Guess</button>
      <p id="feedback-msg" class="feedback"></p>
    </section>

    <!-- About View -->
    <section id="about-view" class="view hidden">
      <h2>About Glotle</h2>
      <p>Test your linguistic knowledge by identifying sentences from around the world!</p>
      <button id="back-to-game-btn" class="primary-btn">Back to Game</button>
    </section>
  </main>

  <!-- Stats Modal -->
  <div id="stats-modal" class="modal hidden">
    <div class="modal-content">
      <button id="close-modal-btn" class="close-btn">&times;</button>
      <h2>Statistics</h2>
      <div class="stats-grid">
        <div class="stat-box">
          <span id="stat-guesses" class="stat-num">0</span>
          <span class="stat-label">Played</span>
        </div>
        <div class="stat-box">
          <span id="stat-accuracy" class="stat-num">0%</span>
          <span class="stat-label">Accuracy</span>
        </div>
        <div class="stat-box">
          <span id="stat-best-streak" class="stat-num">0</span>
          <span class="stat-label">Best Streak</span>
        </div>
      </div>
      <div class="modal-actions">
        <button id="share-btn" class="primary-btn">Share Score</button>
        <button id="modal-about-btn" class="secondary-btn">About</button>
      </div>
    </div>
  </div>
</body>
</html>
