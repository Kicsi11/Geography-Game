<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LingoBounds</title>
<style>
:root {
    --bg: #121212;
    --surface: #191919;
    --surface-2: #202020;
    --surface-3: #292929;
    --border: #303030;
    --text: #f5f5f5;
    --muted: #929292;
    --accent: #8d7cff;
    --accent-soft: rgba(141,124,255,.13);
    --success: #55d79c;
    --danger: #ff667a;
    --warning: #e6b65c;
}

* {
    box-sizing: border-box;
    }

html,
body {
margin: 0;
min-height: 100%;
background: var(–bg);
color: var(–text);
font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, “Segoe UI”, sans-serif;
}

button {
font: inherit;
cursor: pointer;
}

button:focus-visible {
outline: 2px solid var(–accent);
outline-offset: 3px;
}

.app {
min-height: 100vh;
}

.screen {
min-height: 100vh;
}

.hidden {
display: none !important;
}

.menu-screen {
min-height: 100vh;
display: grid;
place-items: center;
padding: 30px;
position: relative;
overflow: hidden;
background:
radial-gradient(circle at 50% 42%, rgba(141,124,255,.12), transparent 34%),
radial-gradient(circle at 18% 15%, rgba(92,123,164,.08), transparent 28%),
var(–bg);
}

.menu-screen::before {
content: “”;
position: absolute;
inset: 0;
opacity: .2;
background-image:
linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
background-size: 48px 48px;
}

.menu-content {
position: relative;
width: min(620px, 100%);
text-align: center;
}

.logo-mark {
width: 72px;
height: 72px;
margin: 0 auto 25px;
display: grid;
place-items: center;
border-radius: 21px;
background: linear-gradient(135deg, #7465ff, #aa78ff);
box-shadow: 0 20px 60px rgba(141,124,255,.3);
font-size: 31px;
font-weight: 900;
}

.menu-title {
margin: 0;
font-size: clamp(48px, 10vw, 86px);
line-height: .92;
letter-spacing: -.07em;
font-weight: 850;
}

.menu-subtitle {
max-width: 480px;
margin: 21px auto 34px;
color: var(–muted);
font-size: 14px;
line-height: 1.6;
}

.menu-actions {
display: grid;
gap: 10px;
width: min(350px, 100%);
margin: auto;
}

.primary-button,
.secondary-button {
border-radius: 12px;
padding: 15px 18px;
font-size: 13px;
font-weight: 800;
transition: transform .18s, background .18s, border-color .18s;
}

.primary-button {
color: #fff;
background: var(–accent);
box-shadow: 0 12px 30px rgba(141,124,255,.2);
}

.secondary-button {
color: #bbb;
border: 1px solid var(–border);
background: rgba(32,32,32,.8);
}

.primary-button:hover,
.secondary-button:hover {
transform: translateY(-2px);
}

.menu-meta {
margin-top: 30px;
color: #626262;
font-size: 10px;
letter-spacing: .04em;
}

.game-screen {
min-height: 100vh;
display: flex;
flex-direction: column;
}

.topbar {
height: 70px;
padding: 0 24px;
display: flex;
align-items: center;
justify-content: space-between;
border-bottom: 1px solid var(–border);
background: rgba(18,18,18,.96);
backdrop-filter: blur(15px);
z-index: 10;
}

.brand {
display: flex;
align-items: center;
gap: 10px;
}

.brand-mark {
width: 34px;
height: 34px;
display: grid;
place-items: center;
border-radius: 9px;
background: linear-gradient(135deg, #7465ff, #aa78ff);
font-size: 14px;
font-weight: 900;
}

.brand-name {
font-size: 16px;
font-weight: 800;
letter-spacing: -.035em;
}

.game-controls {
display: flex;
align-items: center;
gap: 9px;
}

.tier {
padding: 7px 10px;
border-radius: 999px;
background: rgba(201,137,98,.1);
color: #c98962;
border: 1px solid rgba(201,137,98,.25);
font-size: 10px;
font-weight: 800;
}

.elo-display {
color: var(–muted);
font-size: 11px;
}

.elo-display strong {
color: var(–text);
}

.menu-return {
padding: 8px 11px;
border-radius: 8px;
color: #aaa;
border: 1px solid var(–border);
background: var(–surface);
font-size: 10px;
font-weight: 700;
}

.game-main {
width: min(1550px, 100%);
flex: 1;
margin: 0 auto;
padding: 20px;
display: flex;
flex-direction: column;
gap: 15px;
}

.match-header {
display: flex;
justify-content: space-between;
align-items: center;
}

.section-kicker {
color: var(–accent);
text-transform: uppercase;
letter-spacing: .14em;
font-size: 9px;
font-weight: 850;
}

.match-title {
margin: 5px 0 0;
font-size: 24px;
letter-spacing: -.045em;
}

.round-counter {
color: var(–muted);
font-size: 11px;
}

.workspace {
min-height: 650px;
flex: 1;
display: grid;
grid-template-columns: 350px minmax(0, 1fr);
gap: 15px;
}

.panel {
min-width: 0;
border: 1px solid var(–border);
border-radius: 17px;
background: var(–surface);
overflow: hidden;
}

.challenge {
display: flex;
flex-direction: column;
}

.panel-header {
padding: 18px;
border-bottom: 1px solid var(–border);
display: flex;
align-items: center;
justify-content: space-between;
}

.panel-heading {
font-size: 13px;
font-weight: 800;
}

.panel-subheading {
margin-top: 3px;
color: var(–muted);
font-size: 10px;
}

.timer {
width: 48px;
height: 48px;
position: relative;
display: grid;
place-items: center;
}

.timer svg {
position: absolute;
inset: 0;
transform: rotate(-90deg);
}

.timer circle {
fill: none;
stroke-width: 4;
}

.timer-track {
stroke: #303030;
}

.timer-progress {
stroke: var(–accent);
stroke-linecap: round;
transition: stroke-dashoffset .2s linear;
}

.timer-value {
font-size: 12px;
font-weight: 850;
}

.challenge-body {
flex: 1;
display: flex;
flex-direction: column;
gap: 16px;
padding: 18px;
}

.clue-card {
padding: 19px;
border: 1px solid #303030;
border-radius: 13px;
background: linear-gradient(145deg, #202020, #181818);
}

.clue-label {
color: #777;
text-transform: uppercase;
letter-spacing: .12em;
font-size: 9px;
font-weight: 800;
}

.clue-title {
margin: 13px 0 5px;
font-size: 21px;
line-height: 1.15;
letter-spacing: -.035em;
}

.clue-detail {
color: var(–muted);
font-size: 11px;
line-height: 1.55;
}

.audio {
display: flex;
align-items: center;
gap: 11px;
padding: 12px;
border: 1px solid var(–border);
border-radius: 11px;
background: #151515;
}

.play {
width: 38px;
height: 38px;
flex: 0 0 auto;
border-radius: 50%;
display: grid;
place-items: center;
color: white;
background: var(–accent);
}

.wave {
display: flex;
align-items: center;
gap: 3px;
height: 24px;
}

.wave span {
width: 3px;
height: 12px;
border-radius: 5px;
background: #626262;
}

.audio.playing .wave span {
animation: pulse .8s ease-in-out infinite alternate;
}

.audio.playing .wave span:nth-child(2n) {
animation-delay: .12s;
}

.audio.playing .wave span:nth-child(3n) {
animation-delay: .22s;
}

@keyframes pulse {
from { transform: scaleY(.45); }
to { transform: scaleY(1.5); }
}

.audio-copy {
min-width: 0;
}

.audio-name {
font-size: 10px;
font-weight: 800;
}

.audio-status {
color: #6d6d6d;
font-size: 9px;
margin-top: 3px;
}

.instruction {
padding: 13px;
display: flex;
gap: 10px;
border: 1px solid var(–border);
border-radius: 11px;
color: var(–muted);
font-size: 10px;
line-height: 1.5;
}

.instruction-icon {
width: 23px;
height: 23px;
flex: 0 0 auto;
display: grid;
place-items: center;
border-radius: 7px;
color: var(–accent);
background: var(–accent-soft);
font-weight: 900;
}

.match-status {
margin-top: auto;
padding-top: 10px;
}

.status-label {
display: flex;
justify-content: space-between;
color: #777;
font-size: 9px;
margin-bottom: 6px;
}

.status-track {
height: 4px;
border-radius: 99px;
background: #2b2b2b;
overflow: hidden;
}

.status-fill {
width: 0;
height: 100%;
background: var(–accent);
transition: width .25s ease;
}

.map-panel {
display: flex;
flex-direction: column;
}

.map-toolbar {
min-height: 52px;
display: flex;
align-items: center;
gap: 6px;
padding: 8px 13px;
border-bottom: 1px solid var(–border);
}

.map-mode {
padding: 7px 9px;
border-radius: 7px;
color: #777;
background: transparent;
font-size: 9px;
font-weight: 750;
}

.map-mode.active {
color: white;
background: #2a2a2a;
}

.map-legend {
margin-left: auto;
display: flex;
gap: 10px;
color: #777;
font-size: 8px;
}

.legend {
display: flex;
align-items: center;
gap: 4px;
}

.legend i {
width: 6px;
height: 6px;
border-radius: 50%;
}

.uralic { background: #8e78c5; }
.isolate { background: #bc7f99; }
.romance { background: #c29462; }
.celtic { background: #638c78; }

.map-container {
position: relative;
flex: 1;
min-height: 550px;
overflow: hidden;
background:
radial-gradient(circle at 50% 48%, rgba(141,124,255,.065), transparent 35%),
#151515;
}

.map-grid {
position: absolute;
inset: 0;
opacity: .2;
background-image:
linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
background-size: 42px 42px;
}

.europe-map {
position: absolute;
inset: 0;
width: 100%;
height: 100%;
}

.landmass {
fill: #242424;
stroke: #3b3b3b;
stroke-width: 1.3;
vector-effect: non-scaling-stroke;
}

.sea-label {
fill: #4b4b4b;
font-size: 11px;
letter-spacing: .12em;
text-transform: uppercase;
}

.country-label {
fill: #858585;
font-size: 9px;
font-weight: 650;
text-anchor: middle;
pointer-events: none;
}

.zone {
cursor: pointer;
transition: filter .18s, opacity .18s;
}

.zone:hover {
filter: brightness(1.35);
}

.zone-shape {
stroke: #111;
stroke-width: 1.5;
vector-effect: non-scaling-stroke;
}

.zone-hungarian .zone-shape { fill: #806bb1; }
.zone-basque .zone-shape { fill: #a36b86; }
.zone-finnish .zone-shape { fill: #7866ac; }
.zone-romanian .zone-shape { fill: #a67c52; }
.zone-breton .zone-shape { fill: #567b69; }

.zone-outline {
fill: none;
stroke: rgba(255,255,255,.65);
stroke-width: 1.4;
stroke-dasharray: 4 4;
vector-effect: non-scaling-stroke;
pointer-events: none;
}

.zone-name {
fill: #f0f0f0;
font-size: 9px;
font-weight: 800;
text-anchor: middle;
pointer-events: none;
paint-order: stroke;
stroke: #151515;
stroke-width: 3px;
}

.zone-family {
fill: #aaa;
font-size: 7px;
text-anchor: middle;
pointer-events: none;
paint-order: stroke;
stroke: #151515;
stroke-width: 2px;
}

.map-instruction {
position: absolute;
left: 15px;
bottom: 13px;
color: #666;
font-size: 9px;
z-index: 3;
}

.map-scale {
position: absolute;
right: 15px;
bottom: 13px;
color: #555;
font-size: 8px;
z-index: 3;
}

.guess-panel {
position: absolute;
left: 50%;
bottom: 18px;
width: min(350px, calc(100% - 28px));
padding: 14px;
transform: translate(-50%, 150%);
transition: transform .3s cubic-bezier(.2,.8,.2,1);
border: 1px solid #47405f;
border-radius: 13px;
background: rgba(29,27,36,.97);
box-shadow: 0 20px 55px rgba(0,0,0,.5);
z-index: 5;
}

.guess-panel.visible {
transform: translate(-50%, 0);
}

.guess-heading {
display: flex;
justify-content: space-between;
align-items: flex-start;
}

.guess-kicker {
color: #777;
text-transform: uppercase;
letter-spacing: .1em;
font-size: 8px;
font-weight: 800;
}

.guess-name {
margin-top: 3px;
font-size: 17px;
font-weight: 800;
}

.guess-confidence {
color: var(–accent);
font-size: 9px;
font-weight: 800;
}

.guess-actions {
display: flex;
gap: 7px;
margin-top: 12px;
}

.guess-actions button {
flex: 1;
padding: 9px;
border-radius: 8px;
font-size: 9px;
font-weight: 800;
}

.change-guess {
color: #aaa;
background: #292929;
}

.lock-guess {
color: white;
background: var(–accent);
}

.overlay {
position: fixed;
inset: 0;
z-index: 40;
display: grid;
place-items: center;
padding: 20px;
background: rgba(5,5,5,.78);
backdrop-filter: blur(12px);
opacity: 0;
pointer-events: none;
transition: opacity .2s;
}

.overlay.visible {
opacity: 1;
pointer-events: auto;
}

.result-card,
.profile-card {
width: min(430px, 100%);
padding: 27px;
border: 1px solid var(–border);
border-radius: 19px;
background: #1b1b1b;
box-shadow: 0 25px 80px rgba(0,0,0,.55);
}

.result-icon {
width: 55px;
height: 55px;
margin: 0 auto 15px;
display: grid;
place-items: center;
border-radius: 50%;
color: var(–success);
background: rgba(85,215,156,.12);
font-size: 23px;
font-weight: 800;
}

.result-card {
text-align: center;
}

.result-title,
.profile-title {
margin: 0;
font-size: 23px;
letter-spacing: -.04em;
}

.result-description {
margin: 8px auto 18px;
color: var(–muted);
font-size: 11px;
line-height: 1.55;
max-width: 330px;
}

.result-stats {
display: grid;
grid-template-columns: repeat(3,1fr);
margin-bottom: 17px;
overflow: hidden;
border: 1px solid var(–border);
border-radius: 11px;
}

.result-stat {
padding: 11px 5px;
border-right: 1px solid var(–border);
}

.result-stat:last-child {
border: 0;
}

.result-stat strong {
display: block;
font-size: 15px;
}

.result-stat span {
color: #666;
font-size: 8px;
text-transform: uppercase;
}

.full-button {
width: 100%;
padding: 11px;
border-radius: 9px;
color: white;
background: var(–accent);
font-size: 10px;
font-weight: 800;
}

.profile-top {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 20px;
}

.close {
width: 30px;
height: 30px;
border-radius: 8px;
color: #888;
background: #292929;
}

.profile-stat {
padding: 17px;
border: 1px solid var(–border);
border-radius: 12px;
margin-bottom: 9px;
}

.profile-stat span {
color: #777;
font-size: 9px;
text-transform: uppercase;
letter-spacing: .1em;
}

.profile-stat strong {
display: block;
margin-top: 5px;
font-size: 25px;
}

.leaderboard-row {
display: grid;
grid-template-columns: 35px 1fr auto;
align-items: center;
gap: 10px;
padding: 10px 0;
border-bottom: 1px solid #292929;
font-size: 10px;
}

.leaderboard-row:last-child {
border-bottom: 0;
}

.rank {
color: #666;
}

.player-name {
font-weight: 700;
}

.player-score {
color: var(–accent);
font-weight: 800;
}

@media (max-width: 900px) {
.workspace {
grid-template-columns: 1fr;
}

.challenge {
    min-height: 440px;
}
.map-container {
    min-height: 560px;
}

}

@media (max-width: 560px) {
.topbar {
height: 62px;
padding: 0 12px;
}

.brand-name {
    display: none;
}
.elo-display {
    display: none;
}
.game-main {
    padding: 12px;
}
.match-header {
    align-items: flex-start;
}
.match-title {
    font-size: 20px;
}
.workspace {
    gap: 12px;
}
.map-legend {
    display: none;
}
.map-toolbar {
    overflow-x: auto;
}
.map-mode {
    white-space: nowrap;
}
.menu-screen {
    padding: 20px;
}

}
</head>
<body>
<div class="app">
<section class="screen menu-screen" id="menuScreen">
    <div class="menu-content">
        <div class="logo-mark">L</div>
        <h1 class="menu-title">LingoBounds</h1>
        <p class="menu-subtitle">A competitive language geography game. Listen to the clue, locate the linguistic zone, and climb the ranked ladder.</p>
    <div class="menu-actions">
        <button class="primary-button" id="playRanked">Play Ranked Match</button>
        <button class="secondary-button" id="viewProfile">View Profile / Leaderboard</button>
    </div>
    <div class="menu-meta">5 rounds · 30 seconds per round · local ranked simulation</div>
</div>
</section>
<section class="screen game-screen hidden" id="gameScreen">
    <header class="topbar">
        <div class="brand">
            <div class="brand-mark">L</div>
            <div class="brand-name">LingoBounds</div>
        </div>
    <div class="game-controls">
        <div class="tier" id="tierDisplay">Bronze</div>
        <div class="elo-display"><strong id="eloDisplay">1200</strong> ELO</div>
        <button class="menu-return" id="returnMenu">Return to Menu</button>
    </div>
</header>
<main class="game-main">
    <header class="match-header">
        <div>
            <div class="section-kicker">Ranked Match</div>
            <h2 class="match-title">Locate the language</h2>
        </div>
        <div class="round-counter">Round <strong id="roundDisplay">1</strong> / 5</div>
    </header>
    <div class="workspace">
        <article class="panel challenge">
            <header class="panel-header">
                <div>
                    <div class="panel-heading">The Challenge</div>
                    <div class="panel-subheading">Identify the language from the clue.</div>
                </div>
                <div class="timer">
                    <svg viewBox="0 0 48 48">
                        <circle class="timer-track" cx="24" cy="24" r="20"></circle>
                        <circle class="timer-progress" id="timerProgress" cx="24" cy="24" r="20"></circle>
                    </svg>
                    <span class="timer-value" id="timerValue">30</span>
                </div>
            </header>
            <div class="challenge-body">
                <div class="clue-card">
                    <div class="clue-label">Language clue</div>
                    <div class="clue-title" id="clueTitle">Loading…</div>
                    <div class="clue-detail" id="clueDetail"></div>
                </div>
                <div class="audio" id="audioPlayer">
                    <button class="play" id="playAudio" aria-label="Play language sample">▶</button>
                    <div class="audio-copy">
                        <div class="audio-name">Native speaker sample</div>
                        <div class="audio-status" id="audioStatus">00:08 · Ready</div>
                    </div>
                    <div class="wave">
                        <span></span><span></span><span></span><span></span><span></span>
                        <span></span><span></span><span></span><span></span>
                    </div>
                </div>
                <div class="instruction">
                    <div class="instruction-icon">?</div>
                    <div>Click the highlighted linguistic zone you believe matches the clue. Accuracy and remaining time determine your ranked result.</div>
                </div>
                <div class="match-status">
                    <div class="status-label">
                        <span>Guess confidence</span>
                        <span id="confidenceLabel">Awaiting selection</span>
                    </div>
                    <div class="status-track">
                        <div class="status-fill" id="confidenceFill"></div>
                    </div>
                </div>
            </div>
        </article>
        <article class="panel map-panel">
            <div class="map-toolbar">
                <button class="map-mode active">Linguistic zones</button>
                <button class="map-mode">Political borders</button>
                <button class="map-mode">Terrain</button>
                <div class="map-legend">
                    <span class="legend"><i class="uralic"></i>Uralic</span>
                    <span class="legend"><i class="isolate"></i>Isolate</span>
                    <span class="legend"><i class="romance"></i>Romance</span>
                    <span class="legend"><i class="celtic"></i>Celtic</span>
                </div>
            </div>
            <div class="map-container">
                <div class="map-grid"></div>
                <svg class="europe-map" viewBox="0 0 1000 650" preserveAspectRatio="xMidYMid meet" id="europeMap">
                    <path class="landmass" d="M156 173 L205 119 L281 95 L354 108 L419 88 L505 103 L577 78 L661 103 L723 92 L800 133 L865 190 L884 254 L921 310 L895 369 L916 426 L871 478 L822 498 L790 546 L720 568 L652 548 L592 575 L528 551 L462 568 L398 540 L336 555 L284 518 L228 530 L187 481 L132 456 L107 397 L125 343 L101 289 L125 235 Z"></path>
                    <path class="landmass" d="M722 92 L777 54 L835 68 L864 106 L844 148 L800 133 Z"></path>
                    <text class="sea-label" x="435" y="195">NORTH SEA</text>
                    <text class="sea-label" x="686" y="250">BALTIC SEA</text>
                    <text class="sea-label" x="255" y="485">ATLANTIC</text>
                    <text class="sea-label" x="650" y="535">BLACK SEA</text>
                    <text class="country-label" x="303" y="132">UNITED KINGDOM</text>
                    <text class="country-label" x="475" y="125">GERMANY</text>
                    <text class="country-label" x="625" y="151">POLAND</text>
                    <text class="country-label" x="750" y="126">FINLAND</text>
                    <text class="country-label" x="548" y="218">CZECHIA</text>

    <div class="profile-card">
        <div class="profile-top">
            <h2 class="profile-title">Player Profile</h2>
            <button class="close" id="closeProfile">×</button>

    <div class="profile-stat">
        <span>Current rating</span>
        <strong id="profileElo">1200 ELO</strong>
    </div>
    <div class="profile-stat">
        <span>Rank</span>
        <strong id="profileTier">Bronze</strong>
    </div>
    <div class="leaderboard-row">
        <span class="rank">01</span>

    </div>
    <div class="leaderboard-row">
        <span class="rank">02</span>

        <span class="player-score">1715</span>
    </div>
    <div class="leaderboard-row">
        <span class="rank">03</span>
        <span class="player-name">Polyglot</span>
        <span class="player-score">1632</span>
    </div>
    <div class="leaderboard-row">
        <span class="rank">42</span>
        <span class="player-name">You</span>
        <span class="player-score" id="leaderboardElo">1200</span>
    </div>
</div>
</div>
</div>
<script>
const languageZones = [
    {
        id: "hungarian",
        name: "Hungarian",
        family: "Finno-Ugric",
        clue: "A Central European language that forms a distinctive Uralic enclave among predominantly Indo-European neighbors.",
        detail: "Look toward the Carpathian Basin. Its closest linguistic relatives are far to the northeast.",
        target: { x: 599, y: 319 }
    },
    {
        id: "basque",
        name: "Basque",
        family: "Language isolate",
        clue: "A language with no demonstrated genetic relationship to the surrounding Romance languages.",
        detail: "Search the mountainous borderlands between northern Spain and southwestern France.",
        target: { x: 414, y: 354 }
    },
    {
        id: "finnish",
        name: "Finnish",
        family: "Uralic",
        clue: "A Uralic language spoken on the northern shores of the Baltic Sea, with extensive case morphology.",
        detail: "Head toward the forests and lakes of Northern Europe.",
        target: { x: 763, y: 129 }
    },
    {
        id: "romanian",
        name: "Romanian",
        family: "Romance",
        clue: "A Romance language whose geographic surroundings are dominated by Slavic and Balkan languages.",
        detail: "Look east of the Carpathians and north of the lower Danube.",
        target: { x: 699, y: 365 }
    },
    {
        id: "breton",
        name: "Breton",
        family: "Celtic",
        clue: "A surviving Celtic language concentrated in a western peninsula of France.",
        detail: "Search the Atlantic-facing peninsula in northwestern France.",
        target: { x: 375, y: 258 }
    }
];
const gameState = {
    elo: 1200,
    tier: "Bronze",
    currentRound: 0,
    totalRounds: 5,
    secondsRemaining: 30,
    activeZone: null,
    selectedZone: null,
    selectedCoordinates: null,
    gameRunning: false,
    roundResolved: false,
    timerHandle: null,
    roundSequence: []
};
const menuScreen = document.getElementById("menuScreen");
const gameScreen = document.getElementById("gameScreen");
const resultOverlay = document.getElementById("resultOverlay");
const profileOverlay = document.getElementById("profileOverlay");
const timerValue = document.getElementById("timerValue");
const timerProgress = document.getElementById("timerProgress");
const eloDisplay = document.getElementById("eloDisplay");
const tierDisplay = document.getElementById("tierDisplay");
const roundDisplay = document.getElementById("roundDisplay");
const clueTitle = document.getElementById("clueTitle");
const clueDetail = document.getElementById("clueDetail");
const guessPanel = document.getElementById("guessPanel");
const selectedZoneName = document.getElementById("selectedZoneName");
const selectedConfidence = document.getElementById("selectedConfidence");
const confidenceFill = document.getElementById("confidenceFill");
const confidenceLabel = document.getElementById("confidenceLabel");
const audioPlayer = document.getElementById("audioPlayer");
const audioStatus = document.getElementById("audioStatus");
const timerCircumference = 2 * Math.PI * 20;
timerProgress.style.strokeDasharray = timerCircumference;
function shuffleZones() {
    const copy = [...languageZones];
    for (let index = copy.length - 1; index > 0; index--) {
        const randomIndex = Math.floor(Math.random() * (index + 1));
        [copy[index], copy[randomIndex]] = [copy[randomIndex], copy[index]];
    }
    return copy;
}
function getTierFromElo(elo) {
    if (elo >= 1500) return "Gold";
    if (elo >= 1300) return "Silver";
    return "Bronze";
}
function updateRankDisplay() {
    gameState.tier = getTierFromElo(gameState.elo);
    eloDisplay.textContent = gameState.elo;
    tierDisplay.textContent = gameState.tier;
    if (gameState.tier === "Gold") {
        tierDisplay.style.color = "#e9b949";
        tierDisplay.style.background = "rgba(233,185,73,.1)";
        tierDisplay.style.borderColor = "rgba(233,185,73,.25)";
    } else if (gameState.tier === "Silver") {
        tierDisplay.style.color = "#b9c0ca";
        tierDisplay.style.background = "rgba(185,192,202,.1)";
        tierDisplay.style.borderColor = "rgba(185,192,202,.25)";
    } else {
        tierDisplay.style.color = "#c98962";
        tierDisplay.style.background = "rgba(201,137,98,.1)";
        tierDisplay.style.borderColor = "rgba(201,137,98,.25)";
    }
}
function resetTimerVisuals() {
    timerValue.textContent = gameState.secondsRemaining;
    timerProgress.style.strokeDashoffset = timerCircumference * (1 - gameState.secondsRemaining / 30);
    timerProgress.style.stroke = "var(--accent)";
}
function initializeRankedMatch() {
    clearInterval(gameState.timerHandle);
    gameState.currentRound = 0;
    gameState.roundSequence = shuffleZones();
    gameState.gameRunning = true;
    gameState.roundResolved = false;
    gameState.selectedZone = null;
    gameState.selectedCoordinates = null;
    menuScreen.classList.add("hidden");
    gameScreen.classList.remove("hidden");
    updateRankDisplay();
    beginRound();
}
function beginRound() {
    if (!gameState.gameRunning) return;
    gameState.currentRound += 1;
    if (gameState.currentRound > gameState.totalRounds) {
        finishMatch();
        return;
    }
    gameState.activeZone = gameState.roundSequence[gameState.currentRound - 1];
    gameState.secondsRemaining = 30;
    gameState.roundResolved = false;
    gameState.selectedZone = null;
    gameState.selectedCoordinates = null;
    roundDisplay.textContent = gameState.currentRound;
    clueTitle.textContent = gameState.activeZone.clue;
    clueDetail.textContent = `${gameState.activeZone.family} · ${gameState.activeZone.detail}`;
    guessPanel.classList.remove("visible");
    confidenceFill.style.width = "0";
    confidenceLabel.textContent = "Awaiting selection";
    audioPlayer.classList.remove("playing");
    audioStatus.textContent = "00:08 · Ready";
    resetTimerVisuals();
    startRoundTimer();
}
function startRoundTimer() {
    clearInterval(gameState.timerHandle);
    gameState.timerHandle = setInterval(() => {
        if (!gameState.gameRunning || gameState.roundResolved) return;
        gameState.secondsRemaining -= 1;
        resetTimerVisuals();
        if (gameState.secondsRemaining <= 7) {
            timerProgress.style.stroke = "var(--danger)";
        }
        if (gameState.secondsRemaining <= 0) {
            clearInterval(gameState.timerHandle);
            resolveTimeout();
        }
    }, 1000);
}
function calculateAccuracy(zone) {
    if (!gameState.selectedCoordinates) return 0;
    const dx = gameState.selectedCoordinates.x - zone.target.x;
    const dy = gameState.selectedCoordinates.y - zone.target.y;
    const distance = Math.sqrt(dx * dx + dy * dy);
    return Math.max(0, Math.min(100, Math.round(100 - distance * 1.7)));
}
function selectLanguageZone(event) {
    if (!gameState.gameRunning || gameState.roundResolved) return;
    const element = event.currentTarget;
    const zoneName = element.dataset.zone;
    const zone = languageZones.find(item => item.name === zoneName);
    if (!zone) return;
    gameState.selectedZone = zone;
    const svg = document.getElementById("europeMap");
    const point = svg.createSVGPoint();
    point.x = Number(element.dataset.x);
    point.y = Number(element.dataset.y);
    gameState.selectedCoordinates = {
        x: point.x,
        y: point.y
    };
    const accuracy = calculateAccuracy(zone);
    selectedZoneName.textContent = zone.name;
    selectedConfidence.textContent = `${accuracy}% proximity`;
    confidenceFill.style.width = `${accuracy}%`;
    confidenceLabel.textContent = `${accuracy}% estimated accuracy`;
    guessPanel.classList.add("visible");
}
function clearSelection() {
    gameState.selectedZone = null;
    gameState.selectedCoordinates = null;
    guessPanel.classList.remove("visible");
    confidenceFill.style.width = "0";
    confidenceLabel.textContent = "Awaiting selection";
}
function calculateEloChange(accuracy, correct, timedOut) {
    if (timedOut) return -20;
    if (correct) {
        const timeBonus = Math.round(gameState.secondsRemaining * 0.45);
        const precisionBonus = Math.round(accuracy * 0.12);
        return Math.max(8, 10 + timeBonus + precisionBonus);
    }
    const protection = Math.round(accuracy * 0.05);
    return -Math.max(7, 20 - protection);
}
function resolveGuess() {
    if (!gameState.selectedZone || gameState.roundResolved) return;
    clearInterval(gameState.timerHandle);
    gameState.roundResolved = true;
    const accuracy = calculateAccuracy(gameState.activeZone);
    const correct = gameState.selectedZone.id === gameState.activeZone.id;
    const eloChange = calculateEloChange(accuracy, correct, false);
    gameState.elo = Math.max(0, gameState.elo + eloChange);
    showResult(correct, accuracy, eloChange, false);
}
function resolveTimeout() {
    if (gameState.roundResolved) return;
    gameState.roundResolved = true;
    gameState.elo = Math.max(0, gameState.elo - 20);
    showResult(false, 0, -20, true);
}
function showResult(correct, accuracy, eloChange, timedOut) {
    updateRankDisplay();
    const resultIcon = document.getElementById("resultIcon");
    const resultTitle = document.getElementById("resultTitle");
    const resultDescription = document.getElementById("resultDescription");
    const resultAccuracy = document.getElementById("resultAccuracy");
    const resultTime = document.getElementById("resultTime");
    const resultElo = document.getElementById("resultElo");
    resultIcon.textContent = correct ? "✓" : "×";
    resultIcon.style.color = correct ? "var(--success)" : "var(--danger)";
    resultIcon.style.background = correct
        ? "rgba(85,215,156,.12)"
        : "rgba(255,102,122,.12)";
    if (timedOut) {
        resultTitle.textContent = "Time expired";
        resultDescription.textContent = `The target language was ${gameState.activeZone.name}. Speed matters in ranked play.`;
    } else if (correct) {
        resultTitle.textContent = "Correct zone";
        resultDescription.textContent = `You identified ${gameState.activeZone.name} with ${accuracy}% proximity.`;
    } else {
        resultTitle.textContent = "Wrong zone";
        resultDescription.textContent = `The clue pointed to ${gameState.activeZone.name}. Your selection was ${gameState.selectedZone.name}.`;
    }
    resultAccuracy.textContent = timedOut ? "—" : `${accuracy}%`;
    resultTime.textContent = `${gameState.secondsRemaining}s`;
    resultElo.textContent = `${eloChange >= 0 ? "+" : ""}${eloChange}`;
    resultOverlay.classList.add("visible");
}
function continueToNextRound() {
    resultOverlay.classList.remove("visible");
    if (gameState.currentRound >= gameState.totalRounds) {
        finishMatch();
        return;
    }
    beginRound();
}
function finishMatch() {
    clearInterval(gameState.timerHandle);
    gameState.gameRunning = false;
    resultOverlay.classList.remove("visible");
    gameScreen.classList.add("hidden");
    menuScreen.classList.remove("hidden");
    updateRankDisplay();
}
function returnToMenu() {
    clearInterval(gameState.timerHandle);
    gameState.gameRunning = false;
    gameState.roundResolved = false;
    gameState.selectedZone = null;
    gameState.selectedCoordinates = null;
    guessPanel.classList.remove("visible");
    resultOverlay.classList.remove("visible");
    gameScreen.classList.add("hidden");
    menuScreen.classList.remove("hidden");
}
function openProfile() {
    document.getElementById("profileElo").textContent = `${gameState.elo} ELO`;
    document.getElementById("profileTier").textContent = gameState.tier;
    document.getElementById("leaderboardElo").textContent = gameState.elo;
    profileOverlay.classList.add("visible");
}
document.getElementById("playRanked").addEventListener("click", initializeRankedMatch);
document.getElementById("viewProfile").addEventListener("click", openProfile);
document.getElementById("returnMenu").addEventListener("click", returnToMenu);
document.getElementById("lockGuess").addEventListener("click", resolveGuess);
document.getElementById("changeGuess").addEventListener("click", clearSelection);
document.getElementById("continueRound").addEventListener("click", continueToNextRound);
document.getElementById("closeProfile").addEventListener("click", () => {
    profileOverlay.classList.remove("visible");
});
document.querySelectorAll(".zone").forEach(zone => {
    zone.addEventListener("click", selectLanguageZone);
});
document.querySelectorAll(".map-mode").forEach(mode => {
    mode.addEventListener("click", () => {
        document.querySelectorAll(".map-mode").forEach(item => item.classList.remove("active"));
        mode.classList.add("active");
    });
});
document.getElementById("playAudio").addEventListener("click", () => {
    const playing = audioPlayer.classList.toggle("playing");
    audioStatus.textContent = playing ? "00:08 · Playing" : "00:08 · Ready";
});
profileOverlay.addEventListener("click", event => {
    if (event.target === profileOverlay) {
        profileOverlay.classList.remove("visible");
    }
});
updateRankDisplay();
</script>
</body>
