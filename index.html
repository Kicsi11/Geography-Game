<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glotle Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Modal Header & Trigger -->
  <div class="top-bar">
    <button id="open-modal-btn" class="primary-btn">Settings &amp; Leaderboard</button>
  </div>

  <!-- Combined Settings, Stats & Leaderboard Modal -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Settings &amp; Leaderboard</h2>
        <button id="close-modal-btn" class="close-btn">&times;</button>
      </div>

      <!-- Account / Username Setup -->
      <div class="modal-section">
        <h3>Player Account</h3>
        <div class="account-input-group">
          <input type="text" id="username-input" placeholder="Enter username..." maxlength="16" />
          <button id="save-username-btn" class="secondary-btn">Save</button>
        </div>
      </div>

      <!-- User Stats -->
      <div class="modal-section">
        <h3>Your Statistics</h3>
        <div class="stats-grid">
          <div class="stat-box">
            <span id="stat-guesses" class="stat-num">0</span>
            <span class="stat-label">Guesses</span>
          </div>
          <div class="stat-box">
            <span id="stat-accuracy" class="stat-num">0%</span>
            <span class="stat-label">Accuracy</span>
          </div>
          <div class="stat-box">
            <span id="stat-best-streak" class="stat-num">0</span>
            <span class="stat-label">Best Streak</span>
          </div>
        </div>
      </div>

      <!-- Scrollable Top 100 Leaderboard -->
      <div class="modal-section">
        <div class="leaderboard-header">
          <h3>Top 100 Leaderboard</h3>
          <span id="user-rank-display" class="user-rank-tag">Your Rank: --</span>
        </div>
        <div class="leaderboard-scroll-container">
          <ul id="leaderboard-list" class="leaderboard-list">
            <!-- Dynamic items rendered via JS -->
          </ul>
        </div>
      </div>

      <!-- Links & Actions -->
      <div class="modal-section">
        <h3>Information &amp; Legal</h3>
        <div class="info-links">
          <button class="info-link-btn" data-target="about-content">About</button>
          <button class="info-link-btn" data-target="privacy-content">Privacy Policy</button>
          <button class="info-link-btn" data-target="terms-content">Terms of Service</button>
          <button class="info-link-btn" data-target="contact-content">Contact</button>
        </div>
      </div>

      <div class="modal-actions">
        <button id="share-btn" class="primary-btn">Share Score</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
